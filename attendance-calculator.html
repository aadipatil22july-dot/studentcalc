<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Attendance Calculator | StudentCalc</title><meta name="description" content="Calculate your current attendance percentage and see how many classes you need to attend."><link rel="stylesheet" href="style.css">    <meta name="google-site-verification" content="DdJY1gfZoipAT3EjQ_6vjmw_Wul4npV05gLbmb_-Sp0" />
</head><body><main><div class="card"><h1>Attendance Calculator</h1><input id="a" class="input" type="number" placeholder="Classes attended"><input id="b" class="input" type="number" placeholder="Total classes"><button class="btn" onclick="calc()">Calculate</button><div id="r" class="result"></div><a class="back" href="index.html">← Back</a></div></main><script>function calc(){let a=+document.getElementById('a').value,b=+document.getElementById('b').value;document.getElementById('r').textContent=b>0?'Attendance: '+((a/b)*100).toFixed(2)+'%':'Enter valid classes.'}</script></body></html>
