<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CGPA Calculator | StudentCalc</title><meta name="description" content="Free CGPA calculator for students. Calculate CGPA from total grade points and semesters."><link rel="stylesheet" href="style.css">    <meta name="google-site-verification" content="DdJY1gfZoipAT3EjQ_6vjmw_Wul4npV05gLbmb_-Sp0" />
</head><body><main><div class="card"><h1>CGPA Calculator</h1><p>Enter your semester CGPAs to calculate an average.</p><input id="a" class="input" placeholder="Semester CGPAs, e.g. 8.2, 7.5, 9"><button class="btn" onclick="calc()">Calculate CGPA</button><div id="r" class="result"></div><p class="note">This calculates a simple average. Your university may use a different credit-weighted formula.</p><a class="back" href="index.html">← Back</a></div></main><script>function calc(){let x=document.getElementById('a').value.split(',').map(Number).filter(Number.isFinite);document.getElementById('r').textContent=x.length?'CGPA: '+(x.reduce((s,n)=>s+n,0)/x.length).toFixed(2):'Enter valid values.'}</script></body></html>
