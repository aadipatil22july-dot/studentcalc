<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Discount Calculator | StudentCalc</title><meta name="description" content="Calculate discount amount and final price quickly with this free discount calculator."><link rel="stylesheet" href="style.css">    <meta name="google-site-verification" content="DdJY1gfZoipAT3EjQ_6vjmw_Wul4npV05gLbmb_-Sp0" />
</head><body><main><div class="card"><h1>Discount Calculator</h1><input id="a" class="input" type="number" placeholder="Original price"><input id="b" class="input" type="number" placeholder="Discount %"><button class="btn" onclick="calc()">Calculate</button><div id="r" class="result"></div><a class="back" href="index.html">← Back</a></div></main><script>function calc(){let a=+document.getElementById('a').value,b=+document.getElementById('b').value;let x=a*b/100;document.getElementById('r').textContent=a>=0&&b>=0?'Discount: '+x.toFixed(2)+' | Final price: '+(a-x).toFixed(2):'Enter valid values.'}</script></body></html>
