<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Marks Required Calculator | StudentCalc</title><meta name="description" content="Find the marks required to reach a target percentage in your exam."><link rel="stylesheet" href="style.css">    <meta name="google-site-verification" content="DdJY1gfZoipAT3EjQ_6vjmw_Wul4npV05gLbmb_-Sp0" />
</head><body><main><div class="card"><h1>Marks Required Calculator</h1><input id="a" class="input" type="number" placeholder="Current marks"><input id="b" class="input" type="number" placeholder="Total marks so far"><input id="c" class="input" type="number" placeholder="Final total marks"><input id="d" class="input" type="number" placeholder="Target percentage"><button class="btn" onclick="calc()">Calculate</button><div id="r" class="result"></div><a class="back" href="index.html">← Back</a></div></main><script>function calc(){let a=+document.getElementById('a').value,b=+document.getElementById('b').value,c=+document.getElementById('c').value,d=+document.getElementById('d').value;let need=c*d/100-a;document.getElementById('r').textContent=c>b?'Marks needed in remaining: '+Math.max(0,need).toFixed(2):'Enter valid totals.'}</script></body></html>
