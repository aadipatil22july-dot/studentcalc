<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Percentage Calculator for Students | StudentCalc</title><meta name="description" content="Calculate percentage from marks quickly with this free student percentage calculator."><link rel="stylesheet" href="style.css">    <meta name="google-site-verification" content="DdJY1gfZoipAT3EjQ_6vjmw_Wul4npV05gLbmb_-Sp0" />
</head><body><main><div class="card"><h1>Percentage Calculator</h1><p>Enter your obtained and total marks.</p><input id="a" class="input" type="number" placeholder="Obtained marks"><input id="b" class="input" type="number" placeholder="Total marks"><button class="btn" onclick="calc()">Calculate</button><div id="r" class="result"></div><a class="back" href="index.html">← Back to StudentCalc</a></div></main><script>function calc(){let a=+document.getElementById('a').value,b=+document.getElementById('b').value;document.getElementById('r').textContent=b>0?'Percentage: '+((a/b)*100).toFixed(2)+'%':'Enter valid marks.'}</script></body></html>
