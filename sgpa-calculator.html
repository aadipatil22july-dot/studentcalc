<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SGPA Calculator | StudentCalc</title><meta name="description" content="Free SGPA calculator using grade points and credits for students."><link rel="stylesheet" href="style.css">    <meta name="google-site-verification" content="DdJY1gfZoipAT3EjQ_6vjmw_Wul4npV05gLbmb_-Sp0" />
</head><body><main><div class="card"><h1>SGPA Calculator</h1><p>Enter grade points and credits as pairs: 8x4, 9x3, 7x2</p><input id="a" class="input" placeholder="Example: 8x4, 9x3, 7x2"><button class="btn" onclick="calc()">Calculate SGPA</button><div id="r" class="result"></div><a class="back" href="index.html">← Back</a></div></main><script>function calc(){let p=document.getElementById('a').value.split(',').map(v=>v.trim().split('x').map(Number)).filter(v=>v.length===2&&v.every(Number.isFinite));let c=p.reduce((s,v)=>s+v[1],0),w=p.reduce((s,v)=>s+v[0]*v[1],0);document.getElementById('r').textContent=c?'SGPA: '+(w/c).toFixed(2):'Enter valid pairs.'}</script></body></html>
